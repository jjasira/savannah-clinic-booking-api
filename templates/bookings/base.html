<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Savannah Clinic{% endblock %}</title>
  <style>
    :root { --navy:#0b2545; --teal:#00a6a6; --light:#f5f8fc; --ink:#172033; --muted:#5d687b; }
    * { box-sizing:border-box; } body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--light); color:var(--ink); }
    .nav { background:var(--navy); min-height:68px; display:flex; align-items:center; padding:0 7%; gap:28px; box-shadow:0 2px 12px #0b254533; }
    .brand { color:white; text-decoration:none; font-size:1.1rem; font-weight:750; letter-spacing:.01em; margin-right:auto; } .brand span { color:#53e0d1; }
    .nav-links { display:flex; align-items:center; gap:7px; } .nav-links a { color:#dce8f7; text-decoration:none; padding:9px 12px; border-radius:7px; font-weight:600; font-size:.92rem; }
    .nav-links a:hover,.nav-links a.active { color:white; background:#ffffff1d; } .nav-links .admin { background:var(--teal); color:#062d32; } .nav-links .admin:hover { background:#53e0d1; color:#062d32; }
    main { max-width:1120px; margin:auto; padding:54px 28px; } .hero { background:linear-gradient(120deg,#0b2545,#146c78); color:white; border-radius:20px; padding:62px; overflow:hidden; position:relative; }
    .hero::after { content:""; position:absolute; right:-65px; bottom:-110px; width:300px; height:300px; border:45px solid #53e0d144; border-radius:50%; }
    .eyebrow { color:#8deee4; font-size:.78rem; font-weight:800; letter-spacing:.11em; text-transform:uppercase; } h1 { font-size:clamp(2.1rem,5vw,3.7rem); line-height:1.08; max-width:640px; margin:12px 0 16px; }
    .hero p { max-width:590px; color:#d8edf0; font-size:1.08rem; line-height:1.65; } .button { display:inline-block; margin-top:14px; background:#53e0d1; color:#062d32; padding:12px 18px; text-decoration:none; border-radius:8px; font-weight:750; }
    .button:hover { background:white; } .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:28px; } .card { background:white; border:1px solid #dfe6ef; border-radius:13px; padding:24px; box-shadow:0 4px 15px #17325a0b; }
    .card h2 { font-size:1.08rem; margin:0 0 8px; } .card p { color:var(--muted); font-size:.94rem; line-height:1.55; } .card a { color:#087b80; font-weight:700; text-decoration:none; }
    .docs { background:white; border-radius:16px; padding:34px; } .endpoint { border-top:1px solid #e4e9f1; padding:20px 0; display:grid; grid-template-columns:82px 1fr; gap:15px; } .method { align-self:start; text-align:center; padding:5px; border-radius:5px; font-size:.73rem; font-weight:800; background:#dff6f3; color:#087b80; }
    .section-heading { margin:36px 0 8px; color:var(--navy); } .section-intro { color:var(--muted); line-height:1.6; }
    .doctor-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:22px; }
    .doctor-card { background:white; border:1px solid #dfe6ef; border-radius:13px; padding:22px; }
    .doctor-card h2 { margin:0 0 8px; color:var(--navy); font-size:1.12rem; }
    .doctor-meta { color:var(--muted); line-height:1.6; margin:6px 0 14px; }
    .doctor-id { display:inline-block; background:#eef2f7; color:#253954; padding:3px 8px; border-radius:5px; font-size:.85rem; }
    .text-link { color:#087b80; font-weight:700; text-decoration:none; }
    .text-link:hover { text-decoration:underline; }
    .empty-state { background:white; border:1px dashed #b8c5d4; border-radius:13px; padding:24px; color:var(--muted); margin-top:22px; }
    code { background:#eef2f7; padding:2px 5px; border-radius:4px; color:#253954; } footer { text-align:center; padding:28px; color:#718096; font-size:.85rem; }
    @media (max-width:650px) { .nav { padding:14px 20px; align-items:flex-start; flex-wrap:wrap; gap:12px; } .nav-links { width:100%; overflow-x:auto; } main { padding:25px 16px; } .hero { padding:38px 28px; } .grid,.doctor-list { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <nav class="nav" aria-label="Main navigation">
    <a class="brand" href="{% url 'home' %}">Savannah <span>Clinic</span></a>
    <div class="nav-links">
      <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
      <a href="{% url 'doctor-directory' %}" class="{% if request.resolver_match.url_name == 'doctor-directory' %}active{% endif %}">Doctors</a>
      <a href="{% url 'api-guide' %}" class="{% if request.resolver_match.url_name == 'api-guide' %}active{% endif %}">API Guide</a>
      <a class="admin" href="{% url 'admin:index' %}">Admin portal</a>
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer>Savannah Clinic Booking API &middot; Simple appointment scheduling</footer>
</body>
</html>
